name: lint

permissions:
  contents: read

on:
  pull_request:
    branches:
      - main
    paths:
      - ytmusicapi/**
      - tests/**

jobs:
  ruff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/ruff-action@v4.1.0
        with:
          version: 0.16.0
      - uses: astral-sh/ruff-action@v4.1.0
        with:
          version: 0.16.0
          args: format --check
  mypy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install mypy==2.3.0
      - run:  mypy --install-types --non-interactive
